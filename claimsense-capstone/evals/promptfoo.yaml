cuments remain unprocessed or unreadable. Estimates still pending document processing (OCR) cannot support payment authorization.\n[CLS-PAY-012] Payment authority: No automated system output constitutes payment authorization. Every adjudication \u2014 including first-pass approvals \u2014 is a recommendation requiring confirmation by a licensed human adjuster before any financial transaction. High-value payments (net payable above $25,000) require senior-adjuster confirmation."
