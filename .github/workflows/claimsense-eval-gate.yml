name: ClaimSense eval gate

on:
  push:
    paths: ["claimsense-capstone/**", ".github/workflows/claimsense-eval-gate.yml"]
  pull_request:
    paths: ["claimsense-capstone/**", ".github/workflows/claimsense-eval-gate.yml"]

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: claimsense-capstone

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - name: Unit tests (RBAC vs portal oracle, idempotency, guardrail, rules, gate)
        run: python -m pytest -q tests
      - name: Golden set is reproducible from its builder
        run: python evals/build_golden.py && git diff --exit-code -- evals/golden_set.json evals/smoke_set.json
      - name: Corpus check
        run: python -m claimsense corpus check
      - name: Smoke gate (10 cases, mock brain, $0)
        run: python -m claimsense eval --suite smoke --min-pass 0.95 --brain mock --out /tmp/smoke.json
      - name: Regression cases spawned by incident drills
        run: python -m claimsense eval --suite regression --min-pass 1.0 --brain mock --out /tmp/regression.json
      - name: Golden gate (150 cases, >= 95% AND zero adversarial failures)
        run: python -m claimsense eval --suite golden --min-pass 0.95 --brain mock --out /tmp/golden.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: /tmp/*.json

  image:
    # Runs only if the gate job passed: a failing gate blocks the image push.
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (the Dockerfile re-runs the gate inside the build)
        run: docker build -t "ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/claimsense:${{ github.sha }}" .
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/claimsense:${{ github.sha }}"
