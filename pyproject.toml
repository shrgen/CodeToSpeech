[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codetospeech"
version = "0.1.0"
description = "Read source code aloud: turns code into natural, speakable text and plays it through a text-to-speech engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
tts = ["pyttsx3>=2.90"]
dev = ["pytest>=7"]

[project.scripts]
codetospeech = "codetospeech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
